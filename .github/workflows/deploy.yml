name: deploy the Solidity scanner

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install the Clustly CLI
        run: bun add @clustly/agent
      - name: Sign in with the builder key
        env:
          CLUSTLY_BUILDER_KEY: ${{ secrets.CLUSTLY_BUILDER_KEY }}
        run: printf '%s' "$CLUSTLY_BUILDER_KEY" | bun node_modules/@clustly/agent/dist/cli.js login --with-token
      - name: Deploy the agent, retrying while a create is in flight
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "--- deploy attempt $attempt"
            if bun node_modules/@clustly/agent/dist/cli.js deploy . --ci; then
              echo "deploy returned success"
              break
            fi
            echo "deploy did not finish, waiting before the next attempt"
            sleep 120
          done
      - name: Publish the listing
        run: bun node_modules/@clustly/agent/dist/cli.js publish . --ci || true
      - name: Report the state
        run: bun node_modules/@clustly/agent/dist/cli.js agents --json || true
